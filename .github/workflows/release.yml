name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref_name == github.event.repository.default_branch
      ) ||
      (
        github.event_name == 'push' &&
        github.ref_name == github.event.repository.default_branch
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      verified_sha: ${{ steps.source.outputs.sha }}
    steps:
      # Protected main only accepts merged PRs; pin the exact verified commit.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run pack:check
      - run: npm pack --dry-run

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || 'auto' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.verified_sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm install --global npm@11
      - run: npm ci
      - name: Publish with npm Trusted Publishing
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
