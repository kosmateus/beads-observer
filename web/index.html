<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Beads Observer</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="observer-app">
      <header class="app-header">
        <a class="brand" href="#"
          ><span class="brandmark"
            ><svg viewBox="0 0 36 36" aria-hidden="true" width="32" height="32">
              <path
                d="M9 9 27 18 9 27V9"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                opacity=".5"
              />
              <circle cx="9" cy="9" r="4" fill="currentColor" />
              <circle cx="27" cy="18" r="5" fill="currentColor" />
              <circle cx="9" cy="27" r="4" fill="currentColor" /></svg></span
          ><span>beads<span class="brand-sub">OBSERVER</span></span></a
        >
        <div class="project-picker">
          <select id="project-select" data-i18n-aria="workspace"></select>
          <span id="project" hidden></span
          ><small id="project-path" hidden></small
          ><small id="database-path" hidden></small>
        </div>
        <nav id="navigation" class="view-tabs">
          <button data-view="board" class="selected">
            ▦ <span data-i18n="board">Tablica zadań</span></button
          ><button data-view="graph">
            ⑂ <span data-i18n="graph">Graf zależności</span></button
          ><button data-view="list">
            ☷ <span data-i18n="list">Lista zadań</span></button
          ><button data-view="activity">
            ◷ <span data-i18n="activity">Aktywność</span
            ><span id="activity-count" class="counter">0</span>
          </button>
        </nav>
        <div class="language-box">
          <label for="language" data-i18n="language">Language</label
          ><span
            id="resolved-language"
            class="resolved-language"
            aria-live="polite"
          ></span
          ><select id="language" data-i18n-aria="language">
            <option value="system">🌐 System language</option>
          </select>
        </div>
        <div class="theme-box">
          <label for="theme" data-i18n="appearance">Wygląd</label
          ><select id="theme" data-i18n-aria="appearance">
            <option
              value="system"
              data-i18n="systemTheme"
              data-i18n-prefix="◐ "
            >
              ◐ Systemowy
            </option>
            <option value="light" data-i18n="light" data-i18n-prefix="☀ ">
              ☀ Jasny
            </option>
            <option value="dark" data-i18n="dark" data-i18n-prefix="☾ ">
              ☾ Ciemny
            </option>
            <option value="night" data-i18n="night" data-i18n-prefix="☾ ">
              ☾ Nocny
            </option>
          </select>
        </div>
        <div class="sidebar-footer" id="host-version" hidden></div>
        <button
          id="reset-project"
          class="reset-trigger"
          data-i18n="resetTitle"
          disabled
        >
          Reset Beads
        </button>
      </header>
      <main>
        <section id="agent-page" hidden aria-live="polite"></section>
        <section id="detail" hidden aria-live="polite">
          <div
            id="detail-resize"
            role="separator"
            aria-orientation="vertical"
            tabindex="0"
          ></div>
          <div class="detail-top">
            <div id="detail-breadcrumbs"></div>
            <button
              id="close-detail"
              aria-label="Zamknij szczegóły"
              data-i18n-aria="close"
            >
              ←
            </button>
          </div>
          <div id="detail-body"></div>
        </section>

        <section id="epic-page" hidden aria-live="polite"></section>
        <header class="topbar">
          <h1 id="view-title">Tablica zadań</h1>
          <div class="heading-row"></div>

          <div class="toolbar">
            <button id="new-relation" data-i18n="addRelation">Relacja</button>
            <button id="new-issue" class="primary" data-i18n="create" disabled>
              New issue
            </button>
          </div>
        </header>
        <div id="error" role="alert" hidden=""></div>
        <section class="filters">
          <label class="search"
            ><svg
              class="search-icon"
              viewBox="0 0 24 24"
              width="18"
              height="18"
              aria-hidden="true"
            >
              <circle
                cx="10.5"
                cy="10.5"
                r="6.5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
              <path
                d="m16 16 5 5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              /></svg
            ><input
              id="search"
              placeholder="Szukaj tytułu, ID, opisu…"
              aria-label="Szukaj zadań"
              data-i18n-aria="search"
              data-i18n-placeholder="search"
            /><kbd>/</kbd></label
          ><select id="assignee" aria-label="Agent" data-i18n-aria="agent">
            <option value="" data-i18n="agents">Wszyscy agenci</option></select
          ><select
            id="priority"
            aria-label="Priorytet"
            data-i18n-aria="priority"
          >
            <option value="" data-i18n="priority">Priorytet</option>
            <option value="0" data-i18n="critical" data-i18n-prefix="P0 · ">
              P0 · Krytyczny
            </option>
            <option value="1" data-i18n="high" data-i18n-prefix="P1 · ">
              P1 · Wysoki
            </option>
            <option value="2" data-i18n="medium" data-i18n-prefix="P2 · ">
              P2 · Średni
            </option>
            <option value="3" data-i18n="low" data-i18n-prefix="P3 · ">
              P3 · Niski
            </option>
            <option value="4" data-i18n="backlog" data-i18n-prefix="P4 · ">
              P4 · Backlog
            </option></select
          ><select id="type" aria-label="Typ" data-i18n-aria="type">
            <option value="" data-i18n="type">Typ zadania</option></select
          ><select id="label" aria-label="Etykieta" data-i18n-aria="label">
            <option value="" data-i18n="label">Etykieta</option></select
          ><select id="epic" aria-label="Epik" data-i18n-aria="epic">
            <option value="" data-i18n="epics">Wszystkie epiki</option></select
          ><button
            id="ready"
            aria-pressed="false"
            data-i18n="ready"
            data-i18n-prefix="◎ "
          >
            ◎ Gotowe</button
          ><button
            id="blocked"
            aria-pressed="false"
            data-i18n="blocked"
            data-i18n-prefix="⊘ "
          >
            ⊘ Blokady</button
          ><button id="clear" data-i18n="clear">Wyczyść</button>
        </section>
        <div class="results-row">
          <span id="result-count"></span>
          <div>
            <label
              ><span data-i18n="group">Grupuj</span
              ><select id="group" data-i18n-aria="group">
                <option value="none" data-i18n="ungrouped">
                  Bez grupowania
                </option>
                <option value="assignee" data-i18n="agent">Agent</option>
                <option value="epic" data-i18n="epic">Epik</option>
              </select></label
            ><label
              ><span data-i18n="sort">Sortuj</span
              ><select id="sort" data-i18n-aria="sort">
                <option value="priority" data-i18n="priority">Priorytet</option>
                <option value="updated" data-i18n="updated">
                  Ostatnia zmiana
                </option>
                <option value="title" data-i18n="title">Tytuł</option>
              </select></label
            >
          </div>
        </div>
        <section
          id="content"
          aria-label="Zadania"
          data-i18n-aria="issues"
        ></section>
        <footer class="main-footer">
          <span id="beads-version" hidden></span>
          <div class="connection">
            <span id="connection-dot" class="live-dot"></span
            ><span id="connection">Łączenie…</span>
          </div>
          <span id="sync-time" class="muted small"></span>
          <span id="footer-count">Oczekiwanie na pierwszy odczyt</span>
        </footer>
      </main>
      <dialog id="create-dialog" aria-labelledby="create-heading">
        <form id="create-form">
          <div class="detail-top">
            <h2 id="create-heading" data-i18n="newIssue">New issue</h2>
            <button type="button" id="cancel-create" data-i18n-aria="close">
              ✕
            </button>
          </div>
          <p id="create-project" class="muted"></p>
          <p id="create-notice" class="notice" role="status" hidden></p>
          <label
            ><span data-i18n="title">Title</span
            ><input
              id="create-title"
              required
              maxlength="500"
              autocomplete="off"
          /></label>
          <div class="form-row">
            <label
              ><span data-i18n="type">Type</span
              ><select id="create-type">
                <option value="task" data-i18n="task">Task</option>
                <option value="epic" data-i18n="epic">Epic</option>
                <option value="bug">bug</option>
                <option value="feature">feature</option>
                <option value="chore">chore</option>
                <option value="decision">decision</option>
                <option value="spike">spike</option>
                <option value="story">story</option>
                <option value="milestone">milestone</option>
              </select></label
            >
            <label
              ><span data-i18n="priority">Priority</span
              ><select id="create-priority">
                <option value="0">P0</option>
                <option value="1">P1</option>
                <option value="2" selected>P2</option>
                <option value="3">P3</option>
                <option value="4">P4</option>
              </select></label
            >
          </div>
          <label
            ><span data-i18n="parentIssue">Parent item</span
            ><select id="create-parent"></select
          ></label>
          <label
            ><span data-i18n="description">Description</span
            ><textarea
              id="create-description"
              rows="5"
              maxlength="20000"
            ></textarea>
          </label>
          <p id="create-error" role="alert" hidden></p>
          <button
            type="submit"
            id="submit-create"
            class="primary"
            data-i18n="create"
          >
            Create
          </button>
        </form>
      </dialog>
      <dialog id="relation-dialog" aria-labelledby="relation-heading">
        <form id="relation-form">
          <div class="detail-top">
            <h2 id="relation-heading" data-i18n="addRelation">Add relation</h2>
            <button id="cancel-relation" type="button" data-i18n-aria="close">
              ✕
            </button>
          </div>
          <p id="relation-notice" class="notice" hidden></p>
          <label
            ><span data-i18n="issue">Issue</span
            ><select id="relation-issue" required></select
          ></label>
          <label
            ><span data-i18n="relations">Relation</span
            ><select id="relation-type">
              <option value="blocks">blocks</option>
              <option value="parent-child">parent-child</option>
              <option value="related">related</option>
              <option value="tracks">tracks</option>
              <option value="discovered-from">discovered-from</option>
              <option value="until">until</option>
              <option value="caused-by">caused-by</option>
              <option value="validates">validates</option>
              <option value="relates-to">relates-to</option>
              <option value="supersedes">supersedes</option>
            </select></label
          >
          <label
            ><span data-i18n="targetIssue">Target issue</span
            ><select id="relation-target" required></select
          ></label>
          <p id="relation-direction" class="notice"></p>
          <p id="relation-error" role="alert" hidden></p>
          <button id="submit-relation" class="primary" data-i18n="create">
            Create
          </button>
        </form>
      </dialog>
      <div id="toast" role="status" hidden=""></div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
